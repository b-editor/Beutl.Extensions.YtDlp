<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Beutl.Extensions.YtDlp icon: a download arrow dropping onto timeline clips.
    Full-bleed square: the store rounds the corners itself, so keep the artwork away from them.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF" />
      <stop offset="1" stop-color="#4A12D6" />
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E4DAFF" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- Timeline track lane -->
  <rect x="72" y="336" width="368" height="120" rx="24" fill="#2A0A86" opacity="0.45" />
  <!-- Clips -->
  <rect x="92" y="354" width="150" height="36" rx="10" fill="#B9A3FF" />
  <rect x="254" y="354" width="166" height="36" rx="10" fill="#FFFFFF" opacity="0.92" />
  <rect x="92" y="402" width="210" height="36" rx="10" fill="#8F6BFF" />
  <rect x="314" y="402" width="106" height="36" rx="10" fill="#B9A3FF" opacity="0.7" />
  <!-- Download arrow -->
  <path fill="url(#arrow)"
        d="M226 92 a30 30 0 0 1 60 0 V204 H338 a16 16 0 0 1 11.6 27 L267.6 318 a16 16 0 0 1 -23.2 0 L162.4 231 A16 16 0 0 1 174 204 H226 Z" />
</svg>
